<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会議ファシリテーター</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#1e293b">
</head>
<body>

<header>
    <h1>会議ファシリテーター</h1>
    <span id="totalClock" class="total"></span>
</header>

<main>

    <div id="restoreBanner" class="restore" hidden>
        <span id="restoreLabel"></span>
        <span class="restore-actions">
            <button id="restoreBtn" class="btn small">続きから</button>
            <button id="discardBtn" class="btn small ghost">破棄</button>
        </span>
    </div>

    <!-- 1. 会議前 ------------------------------------------------------ -->
    <section id="setup">
        <h2>今日決めること</h2>
        <p class="hint">
            1行に1つ。行末に数字を書くと配分（分）になります。省略時は10分。<br>
            <strong>冒頭でこれを読み上げて、相手と合意してから始めてください。</strong>
        </p>
        <textarea id="agendaInput" rows="6" spellcheck="false"
                  placeholder="来期の設備投資をやるか決める 20&#10;人の採用、今期中に動くか 15&#10;決算の締め方の確認 10"></textarea>

        <label class="check">
            <input type="checkbox" id="useHeat" checked>
            <span>
                声の調子も見る（マイクを使います）
                <small>音量と発話の間隔だけを測ります。通信しません。録音もしません。</small>
            </span>
        </label>

        <div id="setupError" class="error" hidden></div>
        <button id="startBtn" class="btn primary big">会議を始める</button>

        <p class="note">
            録音・文字起こし・議事録は別サービス（Granola / Notta / Otter など）に任せる前提です。
            このページは<strong>議題の時間管理</strong>と<strong>温度</strong>だけを見ます。
        </p>
    </section>

    <!-- 2. 会議中 ------------------------------------------------------ -->
    <section id="running" hidden>
        <div class="panel">
            <div class="topic-head">
                <span id="topicIndex" class="topic-index"></span>
                <span id="topicTitle" class="topic-title"></span>
            </div>
            <div id="topicClock" class="clock">00:00</div>
            <div class="bar"><div id="topicBar" class="bar-fill"></div></div>
        </div>

        <!-- 促し。相手には見せない。読むのも言うのも自分 -->
        <section id="notice" class="notice" hidden>
            <div id="noticeTitle" class="notice-title"></div>
            <div id="noticeLine" class="notice-line"></div>
            <button id="dismissBtn" class="dismiss">閉じる</button>
        </section>

        <div id="heatPanel" class="heat" hidden>
            <div id="heatState" class="heat-state calm">平常値を測定中</div>
            <div class="meter"><div id="meterFill" class="meter-fill"></div></div>
            <div id="heatStats" class="heat-stats">—</div>
        </div>

        <div class="controls">
            <button id="agreedBtn" class="btn primary">決まった → 次へ</button>
            <button id="deferBtn" class="btn warn">持ち越し → 次へ</button>
        </div>
        <div class="controls">
            <button id="markBtn" class="btn mark">ここをマーク</button>
            <button id="endBtn" class="btn stop">会議を終了</button>
        </div>
    </section>

    <!-- 3. 会議後 ------------------------------------------------------ -->
    <section id="done" hidden>
        <h2>結果</h2>
        <ul id="doneTopics" class="results"></ul>
        <p class="hint">
            持ち越しになった論点が、次回の議題です。<strong>却下した案は、理由も一緒に残してください。</strong>
            理由が残っていない案は、何度でも戻ってきます。
        </p>
        <div class="controls">
            <button id="copyBtn" class="btn ghost">コピー</button>
            <button id="exportBtn" class="btn primary">.md で保存</button>
        </div>
        <button id="newBtn" class="btn ghost">新しい会議を始める</button>
    </section>

</main>

<script src="heat.js"></script>
<script src="app.js"></script>
</body>
</html>
